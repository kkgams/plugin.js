name: Publish OCI component
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
  packages: write
concurrency:
  group: oci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Package component
        run: nix develop --command make package
      - name: Publish immutable numeric OCI tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          reference="ghcr.io/kkgams/gams/js:${GITHUB_REF_NAME#v}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          nix develop --command python3 scripts/oci-tag-absent.py "$reference"
          nix develop --command wkg oci push "$reference" build.nosync/plugin.js.wasm
